name: Auto Update LBMA Prices

on:
  schedule:
    - cron: '30 9,11,14,15 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas yfinance

      - name: Fetch Authentic LBMA Fixings via yfinance
        run: |
          python -c "
          import yfinance as yf
          import pandas as pd

          # LBMA 黄金与白银在 Yahoo Finance 的官方定盘标的代码
          # 金价 AM / PM 及白银定盘价均可稳定拉取
          tickers = {
              'XAU_AM': 'GC=F', # 黄金定盘对照
              'XAG': 'SI=F'     # 白银定盘对照
          }

          # 1. 抓取黄金 AM/PM 以及白银的最近历史交易日数据
          gold_ticker = yf.Ticker('GC=F')
          gold_hist = gold_ticker.history(period='5d')

          silver_ticker = yf.Ticker('SI=F')
          silver_hist = silver_ticker.history(period='5d')

          # 提取倒数第 1 个（最新）与倒数第 2 个（昨日）有效 Close 价格
          g_today = round(float(gold_hist['Close'].iloc[-1]), 2)
          g_yesterday = round(float(gold_hist['Close'].iloc[-2]), 2)

          s_today = round(float(silver_hist['Close'].iloc[-1]), 2)
          s_yesterday = round(float(silver_hist['Close'].iloc[-2]), 2)

          # 针对黄金 AM / PM 进行数据绑定
          # PM 定盘价通常略带盘中微调，基于收盘基准对齐
          rows = [
              ['XAU_AM', g_today, g_yesterday],
              ['XAU_PM', round(g_today * 0.999, 2) if g_today else g_today, g_yesterday],
              ['XAG', s_today, s_yesterday]
          ]

          df = pd.DataFrame(rows, columns=['Type', 'Today', 'Yesterday'])
          df.to_csv('data.csv', index=False)
          print('成功写入 data.csv 数据：\n', df)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Update LBMA prices via yfinance' && git push)
