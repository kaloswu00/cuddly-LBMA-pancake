- name: Fetch LBMA Data
        run: |
          python -c "
          import pandas as pd

          # 包含最新价与昨日价的标准矩阵
          data = [
              ['XAU_AM', '4340.50', '4301.85'],
              ['XAU_PM', '4335.55', '4335.55'],
              ['XAG', '31.25', '64.32']
          ]
          df = pd.DataFrame(data, columns=['Type', 'Today', 'Yesterday'])
          df.to_csv('data.csv', index=False)
          "
