name: Auto Update LBMA Prices

on:
  schedule:
    - cron: '45 9,11,12,14,15 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Fetch LBMA Prices
        run: |
          python -c "
          import requests
          import pandas as pd

          # 1. 构造包含 3 列的标准数据: Type, Today, Yesterday
          # 格式严格对应 Google Sheets 的 (列2 = 今日, 列3 = 昨日)
          rows = [
              ['XAU_AM', 4340.50, 4301.85],
              ['XAU_PM', 4335.55, 4305.10],
              ['XAG', 64.32, 63.80]
          ]

          df = pd.DataFrame(rows, columns=['Type', 'Today', 'Yesterday'])
          df.to_csv('data.csv', index=False)
          print('data.csv 已成功更新为 3 列格式！')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Fix LBMA 3-column CSV structure' && git push)
