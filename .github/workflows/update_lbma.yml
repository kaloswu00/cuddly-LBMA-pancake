name: Auto Update LBMA Prices

on:
  schedule:
    - cron: '30 9,11,14,15 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Fetch Authentic LBMA Fixings from FRED
        run: |
          python -c "
          import pandas as pd
          import requests
          import io

          # FRED 官方 LBMA 数据序列代码:
          # GOLDAMGBD228NLBM (Gold AM), GOLDPMGBD228NLBM (Gold PM), SLVPRUSD (Silver)
          series = {
              'XAU_AM': 'GOLDAMGBD228NLBM',
              'XAU_PM': 'GOLDPMGBD228NLBM',
              'XAG': 'SLVPRUSD'
          }

          rows = []
          headers = {'User-Agent': 'Mozilla/5.0'}

          for price_type, series_id in series.items():
              url = f'https://fred.stlouisfed.org/graph/fredgraph.csv?id={series_id}'
              res = requests.get(url, headers=headers, timeout=15)
              
              df = pd.read_csv(io.StringIO(res.text))
              
              # 过滤掉市场休市导致的缺失值 (.)
              df_clean = df[df[series_id] != '.'].copy()
              df_clean[series_id] = pd.to_numeric(df_clean[series_id])
              
              # 提取最新的两个有效交易日价格
              today_price = float(df_clean[series_id].iloc[-1])
              yesterday_price = float(df_clean[series_id].iloc[-2])
              
              rows.append([price_type, today_price, yesterday_price])

          # 导出为标准的 3 列 CSV
          result_df = pd.DataFrame(rows, columns=['Type', 'Today', 'Yesterday'])
          result_df.to_csv('data.csv', index=False)
          print('成功更新 data.csv 数据：\n', result_df)
          "

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Update LBMA prices via FRED' && git push)
