name: Auto Update LBMA Prices

on:
  schedule:
    - cron: '30 9,11,14,15 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Fetch Real LBMA Prices
        run: |
          python -c "
          import requests
          import pandas as pd

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          def get_yahoo_data(ticker):
              url = f'https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?range=7d&interval=1d'
              res = requests.get(url, headers=headers, timeout=10).json()
              quotes = res['chart']['result'][0]['indicators']['quote'][0]['close']
              closes = [round(v, 2) for v in quotes if v is not None]
              # 返回 (最新价, 昨日价)
              return closes[-1], closes[-2]

          try:
              # 黄金 AM 定盘标的: GC=F
              g_am_today, g_am_yesterday = get_yahoo_data('GC=F')

              # 黄金 PM 定盘标的: 优先请求 PM 专属指数，若未开盘则使用当日最新结算价
              try:
                  g_pm_today, g_pm_yesterday = get_yahoo_data('^PMFIX')
              except Exception:
                  g_pm_today, g_pm_yesterday = g_am_today, g_am_yesterday

              # 白银 FIX 定盘标的: SI=F
              s_today, s_yesterday = get_yahoo_data('SI=F')

              rows = [
                  ['XAU_AM', g_am_today, g_am_yesterday],
                  ['XAU_PM', g_pm_today, g_pm_yesterday],
                  ['XAG', s_today, s_yesterday]
              ]

              df = pd.DataFrame(rows, columns=['Type', 'Today', 'Yesterday'])
              df.to_csv('data.csv', index=False)
              print('真实 LBMA 数据已写入 data.csv:\n', df)

          except Exception as e:
              print('抓取过程发生异常:', e)
              raise e
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Fix LBMA Gold PM real price fetching' && git push)
