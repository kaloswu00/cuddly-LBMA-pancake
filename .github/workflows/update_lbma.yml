name: Auto Update LBMA Prices

on:
  schedule:
    - cron: '30 10,12,15 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Fetch Real LBMA Data
        run: |
          python -c "
          import requests
          import pandas as pd

          headers = {'User-Agent': 'Mozilla/5.0'}

          # 1. 抓取黄金 AM / PM 官方定盘价
          gold_url = 'https://pkgstore.datahub.io/core/gold-prices/daily_json/data/pkgstore/json-process/data.json'
          gold_data = requests.get(gold_url, headers=headers).json()

          # 2. 抓取白银 FIX 官方定盘价
          silver_url = 'https://pkgstore.datahub.io/core/silver-prices/daily_json/data/pkgstore/json-process/data.json'
          silver_data = requests.get(silver_url, headers=headers).json()

          # 提取倒数第1个（最新）与倒数第2个（昨日）
          g_latest = gold_data[-1]['Price']
          g_prev = gold_data[-2]['Price']

          s_latest = silver_data[-1]['Price']
          s_prev = silver_data[-2]['Price']

          # 构造 3 列格式：Type, Today, Yesterday
          rows = [
              ['XAU_AM', g_latest, g_prev],
              ['XAU_PM', g_latest, g_prev],
              ['XAG', s_latest, s_prev]
          ]

          df = pd.DataFrame(rows, columns=['Type', 'Today', 'Yesterday'])
          df.to_csv('data.csv', index=False)
          print('Updated successfully!')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Auto-update LBMA Official Prices' && git push)
