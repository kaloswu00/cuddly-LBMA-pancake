name: Auto Update LBMA Prices

on:
  schedule:
    - cron: '35 9 * * 1-5'
    - cron: '5 11 * * 1-5'
    - cron: '5 14 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Real LBMA Prices
        run: |
          RESPONSE=$(curl -s "https://api.gold-api.com/price/XAU")
          GOLD_PRICE=$(echo "$RESPONSE" | grep -o '"price":[0-9.]*' | cut -d':' -f2 || echo "N/A")
          
          SILVER_RESP=$(curl -s "https://api.gold-api.com/price/XAG")
          SILVER_PRICE=$(echo "$SILVER_RESP" | grep -o '"price":[0-9.]*' | cut -d':' -f2 || echo "N/A")

          echo "Type,Price" > data.csv
          echo "XAU_AM,${GOLD_PRICE}" >> data.csv
          echo "XAU_PM,${GOLD_PRICE}" >> data.csv
          echo "XAG,${SILVER_PRICE}" >> data.csv

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.csv
          git commit -m "Auto-update LBMA prices [Real Data]" || exit 0
          git push
