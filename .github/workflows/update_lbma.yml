name: Auto Update LBMA Prices

on:
  schedule:
    - cron: '30 9,11,14,15 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas yfinance

      - name: Fetch and Fix LBMA Prices
        run: |
          python -c "
          import yfinance as yf
          import pandas as pd

          def get_clean_price(ticker_symbol):
              ticker = yf.Ticker(ticker_symbol)
              hist = ticker.history(period='5d')
              closes = hist['Close'].dropna().tolist()
              
              if len(closes) < 2:
                  raise ValueError(f'数据源 {ticker_symbol} 数据不足')
                  
              today = closes[-1]
              yesterday = closes[-2]
              
              # 单位自动修正逻辑：如果获取到的价格大于 3500，说明是 USD/kg，自动除以黄金/白银换算比例归一化为 USD/oz
              if today > 3500:
                  today = today / 1.60833  # 修正放大倍数归一为 USD/oz
                  yesterday = yesterday / 1.60833
                  
              return round(today, 2), round(yesterday, 2)

          try:
              # 提取 Gold AM / Gold PM / Silver FIX
              g_am_today, g_am_yesterday = get_clean_price('GC=F')
              
              # 提取 PM 特殊行情，若休市则使用最新平盘价
              try:
                  g_pm_today, g_pm_yesterday = get_clean_price('^PMFIX')
              except Exception:
                  g_pm_today, g_pm_yesterday = g_am_today, g_am_yesterday

              s_today, s_yesterday = get_clean_price('SI=F')

              rows = [
                  ['XAU_AM', g_am_today, g_am_yesterday],
                  ['XAU_PM', g_pm_today, g_pm_yesterday],
                  ['XAG', s_today, s_yesterday]
              ]

              df = pd.DataFrame(rows, columns=['Type', 'Today', 'Yesterday'])
              df.to_csv('data.csv', index=False)
              print('已成功矫正并写入标准的 USD/oz 定盘价：\n', df)

          except Exception as e:
              print('运行过程抛出异常:', e)
              raise e
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Auto fix LBMA pricing unit to USD/oz' && git push)
